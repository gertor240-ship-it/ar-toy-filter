<!DOCTYPE html>
<html>

<head>
    <title>AR Toy Filter</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- Встроенный скрипт жестов (чтобы точно работал) -->
    <script>
        /* global AFRAME */
        AFRAME.registerComponent("gesture-detector", {
            schema: {
                element: { default: "" }
            },
            init: function () {
                this.targetElement = this.data.element && document.querySelector(this.data.element);
                if (!this.targetElement) {
                    this.targetElement = this.el;
                }
                this.internalState = {
                    previousState: null
                };
                this.emitGestureEvent = this.emitGestureEvent.bind(this);
                this.targetElement.addEventListener("touchstart", this.emitGestureEvent);
                this.targetElement.addEventListener("touchend", this.emitGestureEvent);
                this.targetElement.addEventListener("touchmove", this.emitGestureEvent);
            },
            remove: function () {
                this.targetElement.removeEventListener("touchstart", this.emitGestureEvent);
                this.targetElement.removeEventListener("touchend", this.emitGestureEvent);
                this.targetElement.removeEventListener("touchmove", this.emitGestureEvent);
            },
            emitGestureEvent: function (event) {
                const currentState = this.getTouchState(event);
                const previousState = this.internalState.previousState;
                const gestureContinues = previousState && currentState && currentState.touchCount == previousState.touchCount;
                const gestureEnded = previousState && !gestureContinues;
                const gestureStarted = currentState && !gestureContinues;
                if (gestureEnded) {
                    const eventName = this.getEventPrefix(previousState.touchCount) + "fingerend";
                    this.el.emit(eventName, previousState);
                    this.internalState.previousState = null;
                }
                if (gestureStarted) {
                    currentState.startTime = performance.now();
                    currentState.startPosition = currentState.position;
                    currentState.startSpread = currentState.spread;
                    const eventName = this.getEventPrefix(currentState.touchCount) + "fingerstart";
                    this.el.emit(eventName, currentState);
                    this.internalState.previousState = currentState;
                }
                if (gestureContinues) {
                    const eventDetail = {
                        positionChange: {
                            x: currentState.position.x - previousState.position.x,
                            y: currentState.position.y - previousState.position.y
                        }
                    };
                    if (currentState.spread) {
                        eventDetail.spreadChange = currentState.spread - previousState.spread;
                    }
                    Object.assign(previousState, currentState);
                    Object.assign(eventDetail, previousState);
                    const eventName = this.getEventPrefix(currentState.touchCount) + "fingermove";
                    this.el.emit(eventName, eventDetail);
                }
            },
            getTouchState: function (event) {
                if (event.touches.length === 0) {
                    return null;
                }
                const touchList = [];
                for (let i = 0; i < event.touches.length; i++) {
                    touchList.push(event.touches[i]);
                }
                const touchState = {
                    touchCount: touchList.length
                };
                const centerPositionRawX = touchList.reduce((sum, touch) => sum + touch.clientX, 0) / touchList.length;
                const centerPositionRawY = touchList.reduce((sum, touch) => sum + touch.clientY, 0) / touchList.length;
                touchState.position = {
                    x: centerPositionRawX,
                    y: centerPositionRawY
                };
                if (touchList.length >= 2) {
                    const spread = Math.abs(touchList[0].clientX - touchList[1].clientX) + Math.abs(touchList[0].clientY - touchList[1].clientY);
                    touchState.spread = spread;
                }
                return touchState;
            },
            getEventPrefix: function (touchCount) {
                const numberNames = ["one", "two", "three", "four"];
                return numberNames[Math.max(0, Math.min(touchCount - 1, 3))];
            }
        });

        AFRAME.registerComponent("gesture-handler", {
            schema: {
                enabled: { default: true },
                rotationFactor: { default: 5 },
                minScale: { default: 0.3 },
                maxScale: { default: 8 },
            },
            init: function () {
                this.handleScale = this.handleScale.bind(this);
                this.handleRotation = this.handleRotation.bind(this);
                this.isVisible = false;
                this.initialScale = this.el.object3D.scale.clone();
                this.scaleFactor = 1;
                this.el.sceneEl.addEventListener("markerFound", (e) => {
                    this.isVisible = true;
                });
                this.el.sceneEl.addEventListener("markerLost", (e) => {
                    this.isVisible = false;
                });
            },
            update: function () {
                if (this.data.enabled) {
                    this.el.sceneEl.addEventListener("onefingermove", this.handleRotation);
                    this.el.sceneEl.addEventListener("twofingermove", this.handleScale);
                } else {
                    this.el.sceneEl.removeEventListener("onefingermove", this.handleRotation);
                    this.el.sceneEl.removeEventListener("twofingermove", this.handleScale);
                }
            },
            remove: function () {
                this.el.sceneEl.removeEventListener("onefingermove", this.handleRotation);
                this.el.sceneEl.removeEventListener("twofingermove", this.handleScale);
            },
            handleRotation: function (event) {
                if (this.isVisible) {
                    this.el.object3D.rotation.y += event.detail.positionChange.x * this.data.rotationFactor;
                    this.el.object3D.rotation.x += event.detail.positionChange.y * this.data.rotationFactor;
                }
            },
            handleScale: function (event) {
                if (this.isVisible) {
                    this.scaleFactor *= 1 + event.detail.spreadChange / event.detail.startSpread;
                    this.scaleFactor = Math.min(Math.max(this.scaleFactor, this.data.minScale), this.data.maxScale);
                    this.el.object3D.scale.x = this.scaleFactor * this.initialScale.x;
                    this.el.object3D.scale.y = this.scaleFactor * this.initialScale.y;
                    this.el.object3D.scale.z = this.scaleFactor * this.initialScale.z;
                }
            }
        });
    </script>
</head>

<body style="margin : 0px; overflow: hidden;">
    <!-- Добавляем gesture-detector в сцену -->
    <a-scene embedded arjs vr-mode-ui="enabled: false" gesture-detector renderer="logarithmicDepthBuffer: true;">

        <!-- Маркер Hiro -->
        <!-- raycaster и cursor нужны для обработки касаний -->
        <a-marker preset="hiro" raycaster="objects: .clickable" emitevents="true"
            cursor="fuse: false; rayOrigin: mouse;">

            <!-- Обертка для модели с обработчиком жестов -->
            <!-- rotationFactor: 0.005 - супер плавное вращение -->
            <a-entity id="model-wrapper" class="clickable"
                gesture-handler="minScale: 0.25; maxScale: 10; rotationFactor: 0.005" position="0 0 0" scale="1 1 1">
                <!-- 3D Модель Лошадки (GLB) -->
                <!-- scale="2 2 2" чтобы была побольше -->
                <!-- ВАЖНО: Путь ./models/ (относительный) -->
                <a-entity gltf-model="./models/horse_cardboard.glb" position="0 0 0" rotation="0 0 0"
                    scale="2 2 2"></a-entity>
            </a-entity>

        </a-marker>

        <a-entity camera></a-entity>

        <!-- Добавляем свет, чтобы модель не была темной -->
        <a-light type="ambient" color="white" intensity="2"></a-light>
        <a-light type="directional" color="white" intensity="1" position="-1 1 1"></a-light>
    </a-scene>

    <!-- Подсказка -->
    <div
        style="position: fixed; top: 10px; width: 100%; text-align: center; z-index: 1; color: white; font-family: sans-serif; background: rgba(0,0,0,0.5); padding: 10px;">
        Наведите камеру на маркер Hiro<br>
        <small>Используйте 1 палец для вращения, 2 для зума</small>
    </div>
</body>

</html>
